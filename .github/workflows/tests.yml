name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      # Keep running the other Node versions if one fails, so we see every incompatibility at once.
      fail-fast: false
      matrix:
        # 22.x, 24.x and 26.x resolve to the newest release of each LTS line; "node" is the latest current release.
        # Node 22 is the floor: jsdom, jest-dom and supabase-js all require >=22. Node 25 is skipped: jsdom doesn't support it.
        node-version: [22.x, 24.x, 26.x, node]
    name: unit-tests (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Show Node version
        run: node --version

      - run: npm ci

      - name: Run unit tests
        run: npm run test:run
        env:
          # Placeholders so importing the Supabase client doesn't throw. Tests fake Supabase, so these are never used.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-key
